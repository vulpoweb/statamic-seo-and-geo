name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        statamic: ['^6.0']
        dependencies: [lowest, highest]

    name: PHP ${{ matrix.php }} / Statamic ${{ matrix.statamic }} / ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, intl, gd
          coverage: none

      - name: Require the Statamic version under test
        run: composer require "statamic/cms:${{ matrix.statamic }}" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/pest --compact

      - name: Run tests with database storage
        run: vendor/bin/pest --compact
        env:
          VULPO_SEO_STORAGE_DRIVER: eloquent

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check code style
        run: vendor/bin/pint --test
