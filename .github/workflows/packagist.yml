name: Update Packagist

# The release workflow notifies Packagist itself, because a tag it pushed with
# GITHUB_TOKEN would not trigger this one. This stays for the two cases that
# are not a release: a tag pushed by hand, and re-syncing after the API was
# down or a token had expired.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    name: Notify Packagist

    steps:
      - name: Trigger package update
        run: |
          curl -sf -XPOST -H'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
