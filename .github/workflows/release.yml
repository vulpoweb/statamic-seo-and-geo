name: Release

# Cutting a release is a judgement call -- whether something is a minor or a
# patch is not something a commit log can decide for you -- so the version is
# typed in by a human. Everything after that is mechanical, and this does it:
# the CHANGELOG heading, the tag, the GitHub release and its notes.
#
# Packagist needs no help here. packagist.yml already fires on the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release v${{ inputs.version }}

    steps:
      - name: Refuse to release anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main. This run is on ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version looks like a version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${{ inputs.version }}' is not semver. Expected 1.5.0, or 1.5.0-beta.1."
            exit 1
          fi

          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ inputs.version }} already exists."
            exit 1
          fi

      # Before anything is written, so a failed run leaves no half-made
      # release behind. One job rather than the full matrix: the matrix has
      # already run on every push to main, this is the last look.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, gd
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/pest --compact

      - name: Check code style
        run: vendor/bin/pint --test

      # The notes are the CHANGELOG's own prose. A generated list of commit
      # subjects would be a worse description of the same release.
      - name: Take the release notes from the changelog
        run: |
          awk '/^## Unreleased$/ {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md \
            | sed '/./,$!d' > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has nothing under '## Unreleased'. Write the release notes first."
            exit 1
          fi

          echo "Release notes:"
          cat /tmp/notes.md

      # awk rather than sed: replacing only the first match needs the GNU
      # `0,/re/` address, which is not portable and cannot be tested on a mac.
      - name: Date the changelog entry
        run: |
          awk -v heading="## ${{ inputs.version }} - $(date -u +%Y-%m-%d)" '
            !done && /^## Unreleased$/ { print heading; done = 1; next }
            { print }
          ' CHANGELOG.md > /tmp/CHANGELOG.md

          if ! grep -q "^## ${{ inputs.version }} - " /tmp/CHANGELOG.md; then
            echo "::error::Could not find '## Unreleased' in CHANGELOG.md to rename."
            exit 1
          fi

          mv /tmp/CHANGELOG.md CHANGELOG.md

      - name: Commit, tag and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add CHANGELOG.md
          git commit -m "🔖 chore: release v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"

          # The tag last, so a rejected push to a protected main does not leave
          # a tag pointing at a commit nobody else has.
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/notes.md
