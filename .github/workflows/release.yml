name: Release

# Releasing is merging.
#
# Write the notes under `## Unreleased` as you go. When it is time to ship,
# rename that heading to the version -- `## 2.0.0` -- in a pull request, and
# merging it cuts the release: tag, GitHub release, Packagist.
#
# Nothing fires on an ordinary merge, because nothing fires until a human has
# written a version number down. That keeps semver a judgement call, which a
# commit log cannot make for you, while costing one line in a PR rather than a
# separate trip to the Actions tab.
#
# Re-running is safe: the tag already existing is a no-op, not a failure.

on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version off the top of the changelog
        id: changelog
        run: |
          # The newest heading that names a version. '## Unreleased' is skipped
          # rather than read as a stop sign, so it can sit at the top of the
          # file permanently the way Keep a Changelog has it -- otherwise a
          # standing Unreleased section would mean nothing ever releases.
          heading=$(awk '
            /^## / {
              h = $0
              sub(/^## /, "", h)
              split(h, parts, " ")
              if (parts[1] ~ /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/) { print h; exit }
            }
          ' CHANGELOG.md)

          version=$(echo "$heading" | awk '{print $1}')

          if [ -z "$version" ]; then
            echo "Nothing to release: no '## <version>' heading in the changelog yet."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Newest version heading: '$heading'"

          # Idempotent: an edit to an older entry re-runs this and finds the
          # tag already made.
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The notes are the changelog's own prose. A generated list of commit
          # subjects would describe the same release worse.
          awk -v want="## $heading" '
            seen && /^## / { exit }
            seen           { print }
            $0 == want     { seen = 1 }
          ' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::error::'## $heading' has no notes under it."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

          echo "Release notes:"
          cat /tmp/notes.md

      - name: Set up PHP
        if: steps.changelog.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, gd
          coverage: none

      - name: Install dependencies
        if: steps.changelog.outputs.release == 'true'
        uses: ramsey/composer-install@v3

      # Before the tag, so a red build leaves no release behind. One job rather
      # than the full matrix: that has already run on this commit.
      - name: Run tests
        if: steps.changelog.outputs.release == 'true'
        run: vendor/bin/pest --compact

      - name: Check code style
        if: steps.changelog.outputs.release == 'true'
        run: vendor/bin/pint --test

      - name: Tag
        if: steps.changelog.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git tag -a "v${{ steps.changelog.outputs.version }}" \
            -m "v${{ steps.changelog.outputs.version }}"
          git push origin "v${{ steps.changelog.outputs.version }}"

      - name: Create the release
        if: steps.changelog.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.changelog.outputs.version }}" \
            --title "v${{ steps.changelog.outputs.version }}" \
            --notes-file /tmp/notes.md

      # Here rather than letting packagist.yml catch the tag: a push made with
      # the default GITHUB_TOKEN does not trigger other workflows, so that one
      # never fires for a release cut by this one. v2.0.0 reached GitHub and
      # not Packagist exactly that way.
      - name: Tell Packagist
        if: steps.changelog.outputs.release == 'true'
        run: |
          if [ -z "${{ secrets.PACKAGIST_USERNAME }}" ] || [ -z "${{ secrets.PACKAGIST_TOKEN }}" ]; then
            echo "::error::PACKAGIST_USERNAME or PACKAGIST_TOKEN is missing, so the release is on GitHub but not on Packagist. Set them, then run the 'Update Packagist' workflow by hand."
            exit 1
          fi

          curl -sS --fail-with-body -XPOST -H'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
