tabs:
  vulpo_seo:
    display: SEO
    icon: seo
    sections:
      -
        fields:
          -
            handle: seo_preview
            field:
              type: seo_preview
              display: Preview
      -
        display: 'Search results'
        instructions: 'Leave a field empty to use the site default.'
        fields:
          -
            handle: seo_title
            field:
              type: text
              display: 'Page title'
              instructions: 'Shown as the clickable line in Google. Around 60 characters fit.'
          -
            handle: seo_description
            field:
              type: textarea
              display: Description
              instructions: 'The grey text below the title in Google. Around 155 characters fit.'
          -
            handle: seo_image
            field:
              type: assets
              display: 'Sharing image'
              max_files: 1
              instructions: 'Used when this page is shared on social media or in chat apps.'
      -
        display: Advanced
        fields:
          -
            handle: seo_canonical
            field:
              type: text
              display: 'Canonical URL'
              instructions: 'Only fill in when this page duplicates another one, to point search engines at the original.'
          -
            handle: seo_noindex
            field:
              type: toggle
              display: 'Hide from search engines'
              default: false
              width: 50
          -
            handle: seo_nofollow
            field:
              type: toggle
              display: 'Do not follow links on this page'
              default: false
              width: 50
          -
            handle: seo_sitemap_exclude
            field:
              type: toggle
              display: 'Leave out of the sitemap'
              default: false
              width: 50
  vulpo_seo_schema:
    display: 'Structured data'
    icon: code
    sections:
      -
        display: 'Rich results for search & AI'
        instructions: 'Optional. Extra information that helps Google and AI assistants understand this page. Leave the type on "None" if unsure.'
        fields:
          -
            handle: seo_schema_type
            field:
              type: select
              display: 'Page type'
              default: none
              width: 50
              options:
                none: None
                faq: 'FAQ (questions & answers)'
                article: 'Article / blog post'
                service: Service
                person: 'Person / team member'
                product: Product
                event: Event
          -
            handle: seo_schema_faqs
            field:
              type: grid
              display: 'Frequently asked questions'
              mode: stacked
              add_row: 'Add question'
              reorderable: true
              instructions: 'Each question and answer can appear directly in Google and in AI answers.'
              if:
                seo_schema_type: 'equals faq'
              fields:
                -
                  handle: question
                  field:
                    type: text
                    display: Question
                -
                  handle: answer
                  field:
                    type: textarea
                    display: Answer
          -
            handle: seo_schema_article_headline
            field:
              type: text
              display: Headline
              instructions: 'Defaults to the page title.'
              if:
                seo_schema_type: 'equals article'
          -
            handle: seo_schema_article_description
            field:
              type: textarea
              display: Description
              if:
                seo_schema_type: 'equals article'
          -
            handle: seo_schema_article_author
            field:
              type: text
              display: 'Author name'
              width: 50
              if:
                seo_schema_type: 'equals article'
          -
            handle: seo_schema_article_published
            field:
              type: date
              display: 'Published date'
              time_enabled: false
              width: 50
              if:
                seo_schema_type: 'equals article'
          -
            handle: seo_schema_article_image
            field:
              type: assets
              display: Image
              max_files: 1
              instructions: 'Defaults to the sharing image on the SEO tab.'
              if:
                seo_schema_type: 'equals article'
          -
            handle: seo_schema_service_name
            field:
              type: text
              display: 'Service name'
              width: 50
              instructions: 'Defaults to the page title.'
              if:
                seo_schema_type: 'equals service'
          -
            handle: seo_schema_service_area
            field:
              type: text
              display: 'Area served'
              width: 50
              instructions: 'Defaults to the area served in the SEO settings.'
              if:
                seo_schema_type: 'equals service'
          -
            handle: seo_schema_service_description
            field:
              type: textarea
              display: 'Service description'
              if:
                seo_schema_type: 'equals service'
          -
            handle: seo_schema_person_name
            field:
              type: text
              display: 'Full name'
              width: 50
              instructions: 'Defaults to the page title.'
              if:
                seo_schema_type: 'equals person'
          -
            handle: seo_schema_person_job
            field:
              type: text
              display: 'Job title'
              width: 50
              instructions: 'e.g. "Founder", "Lead developer".'
              if:
                seo_schema_type: 'equals person'
          -
            handle: seo_schema_product_name
            field:
              type: text
              display: 'Product name'
              width: 50
              instructions: 'Defaults to the page title.'
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_brand
            field:
              type: text
              display: Brand
              width: 50
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_description
            field:
              type: textarea
              display: 'Product description'
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_image
            field:
              type: assets
              display: 'Product image'
              max_files: 1
              instructions: 'Defaults to the sharing image on the SEO tab.'
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_sku
            field:
              type: text
              display: SKU
              width: 33
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_price
            field:
              type: text
              display: Price
              width: 33
              instructions: 'Numbers only, e.g. "49.95".'
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_currency
            field:
              type: text
              display: Currency
              width: 33
              default: EUR
              instructions: 'Three letters, e.g. EUR.'
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_product_availability
            field:
              type: select
              display: Availability
              default: InStock
              width: 50
              options:
                InStock: 'In stock'
                OutOfStock: 'Out of stock'
                PreOrder: 'Pre-order'
                Discontinued: Discontinued
              if:
                seo_schema_type: 'equals product'
          -
            handle: seo_schema_event_name
            field:
              type: text
              display: 'Event name'
              width: 50
              instructions: 'Defaults to the page title.'
              if:
                seo_schema_type: 'equals event'
          -
            handle: seo_schema_event_location
            field:
              type: text
              display: Location
              width: 50
              instructions: 'Venue or city.'
              if:
                seo_schema_type: 'equals event'
          -
            handle: seo_schema_event_description
            field:
              type: textarea
              display: 'Event description'
              if:
                seo_schema_type: 'equals event'
          -
            handle: seo_schema_event_start
            field:
              type: date
              display: Starts
              time_enabled: true
              width: 50
              if:
                seo_schema_type: 'equals event'
          -
            handle: seo_schema_event_end
            field:
              type: date
              display: Ends
              time_enabled: true
              width: 50
              if:
                seo_schema_type: 'equals event'
          -
            handle: seo_schema_event_url
            field:
              type: text
              display: 'Tickets or info URL'
              instructions: 'Defaults to this page.'
              if:
                seo_schema_type: 'equals event'
      -
        display: 'Custom structured data'
        instructions: 'For anything the types above do not cover. Paste JSON-LD without the `<script>` tag; `@context` is added when missing. Invalid JSON is ignored rather than breaking the page.'
        fields:
          -
            handle: seo_schema_custom
            field:
              type: code
              display: 'Custom JSON-LD'
              mode: json
              mode_selectable: false
              indent_size: 2
              rulers: false
